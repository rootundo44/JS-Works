<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container" id="task1">
        <div class="task1">
            <h2>Task 1</h2>
            <button id="switchbutton">Switch Theme</button>
        </div>

        <div class="task2">
            <h2>Калькулятор</h2>
            <div class="inputs">
                <input type="number" placeholder="Введіть число A" id="input1">
                <input type="text" placeholder="Введіть знак (+,-,*,/)" id="input2">
                <input type="number" placeholder="Введіть число B" id="input3">
            </div>
            <button id="button1">Обчислити</button>
            <p id="answer1"></p>
        </div>

        <div class="task3">
            <h2>Task 3</h2>
            <input type="text" placeholder="Enter password" id="input4">
            <button id="checkpass">Check Password</button>
            <p id="answer2"></p>
        </div>

        <div class="task4">
            <h1>Клікни швидше!</h1>

            <p id="time">Час: 5 сек</p>
            <p id="clicks">Кліки: 0</span></p>

            <button id="btn">КЛІКАЙ</button>
            <button id="startbtn">Почати гру</button>
        </div>
    </div>



    <script src="./script.js"></script>
</body>

</html>
